const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
async function go(pw,remember){
  document.getElementById('b').textContent='Abrindo…';
  try{const html=await open_(pw);if(remember)ls.set('nc_pw',pw);document.open();document.write(html);document.close();}
  catch(e){ls.del('nc_pw');document.getElementById('e').textContent='Senha incorreta. Tente de novo.';document.getElementById('b').textContent='Entrar';}
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();go(document.getElementById('p').value.trim(),document.getElementById('r').checked)};
const saved=ls.get('nc_pw');if(saved)go(saved,true);
</script></body></html>
